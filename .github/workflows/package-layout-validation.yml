name: C64U package layout and fit

on:
  pull_request:
    paths:
      - 'client/**'
      - 'tools/package_8tml_release.py'
      - 'tools/tests/package_8tml_release_test.py'
      - '.github/workflows/package-layout-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR source
        uses: actions/checkout@v4

      - name: Install C64 compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cc65

      - name: Run manifest and release-inventory regressions
        run: |
          set -eu
          mkdir -p client/build
          python3 tools/tests/module_manifest_generator_test.py
          python3 tools/tests/code_asset_manifest_test.py
          python3 tools/tests/package_8tml_release_test.py

      - name: Test changed launcher, overlays and PRG-root preload (host)
        run: |
          set -eu
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          for asset_flags in "" "-DS64_CODE_ASSET_PUBLISHER=1"; do
            cc $asset_flags -std=c99 -Wall -Wextra -Werror -Iclient/src \
              client/tests/code_assets_test.c client/src/platform/code_overlay_bootstrap.c \
              client/src/platform/code_assets.c client/src/platform/code_assets_validate.c \
              client/src/platform/code_assets_session.c client/src/platform/code_assets_session_build.c \
              client/src/platform/code_assets_session_read.c client/src/platform/code_overlay.c \
              client/src/platform/crc32.c client/src/platform/module_integrity.c \
              client/src/platform/module_manifest.c client/src/platform/reu_runtime.c \
              client/src/platform/reu_runtime_build.c client/src/platform/reu_runtime_allocate.c \
              client/src/platform/reu_runtime_write.c client/src/platform/session_journal.c \
              client/src/platform/session_journal_start.c client/src/platform/system_state.c \
              client/src/platform/system_state_start.c -o "$tmp"
            "$tmp"
          done
          cc -std=c99 -Wall -Wextra -Werror -Iclient/src \
            client/tests/launcher_code_assets_test.c client/src/launcher/code_assets_runtime.c -o "$tmp"
          "$tmp"
          cc -std=c99 -Wall -Wextra -Iclient/src \
            client/tests/module_preload_test.c client/src/platform/module_preload.c \
            client/src/platform/module_manifest.c client/src/platform/module_manifest_build.c \
            client/src/platform/module_manifest_parse.c client/src/platform/dos.c \
            client/src/platform/dos_file.c client/src/platform/dos_reu.c -o "$tmp"
          "$tmp"
          cc -std=c99 -Wall -Wextra -Iclient/src \
            client/tests/launcher_recovery_runtime_test.c \
            client/src/platform/module_session.c client/src/platform/module_session_read.c \
            client/src/platform/module_session_build.c client/src/platform/transfer_capsule.c \
            client/src/platform/transfer_capsule_build.c client/src/platform/transfer_capsule_write.c \
            client/src/platform/module_transfer.c client/src/launcher/recovery_runtime.c \
            client/src/launcher/recovery_flow.c client/src/platform/session_recovery.c \
            client/src/platform/session_journal.c client/src/platform/session_journal_start.c \
            client/src/platform/session_lifecycle.c client/src/platform/session_lifecycle_start.c \
            client/src/platform/system_state.c client/src/platform/system_state_start.c \
            client/src/platform/module_manifest.c client/src/platform/module_manifest_build.c \
            client/src/platform/module_manifest_parse.c client/src/platform/reu_runtime.c \
            client/src/platform/reu_runtime_build.c client/src/platform/reu_runtime_allocate.c \
            client/src/platform/reu_runtime_write.c client/src/platform/dos.c \
            client/src/platform/turbo.c client/src/platform/turbo_capture.c client/src/charset.c -o "$tmp"
          "$tmp"
          # The local picker must draw a visible pending status before each
          # blocked directory read, including paging and failed directory reads.
          cc -std=c99 -Wall -Wextra -Werror -DS64_INDEPENDENT_PUBLISHER=1 \
            -Iclient/tests/local_picker_stubs -Iclient/src \
            client/tests/local_picker_test.c client/src/publisher/local_picker.c \
            client/src/platform/dos_dir.c client/src/platform/dos.c \
            client/src/charset.c -o "$tmp"
          "$tmp"

      - name: Build and check exact SD package and C64 memory guards
        run: |
          set -eu
          make -B -C client STORAGE_ROOT=/sd/ independent-package
          python3 - <<'PY'
          from pathlib import Path
          root = Path('client/build/independent-package/SEE64YOU')
          expected = {'SEE64YOU.PRG', 'S64EDIT.PRG', 'S64PUB.PRG', 'S64CFG.PRG',
                      'SYSTEM/S64FILE.BIN', 'SYSTEM/S64MODEL.BIN',
                      'SYSTEM/S64PREP.BIN', 'SYSTEM/S64RUN.BIN',
                      'SYSTEM/S64MODULE.MNF', 'SYSTEM/S64OVL.MNF'}
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert actual == expected, (sorted(actual - expected), sorted(expected - actual))
          assert {p.name for p in root.rglob('*') if p.is_dir()} == {'SYSTEM'}
          assert not any(p.is_symlink() for p in root.rglob('*'))
          print('SD package: 4 root PRGs and 6 SYSTEM assets')
          PY

      - name: Build and check exact USB1 package and C64 memory guards
        run: |
          set -eu
          make -B -C client STORAGE_ROOT=/USB1/ independent-package
          python3 - <<'PY'
          from pathlib import Path
          root = Path('client/build/independent-package/SEE64YOU')
          expected = {'SEE64YOU.PRG', 'S64EDIT.PRG', 'S64PUB.PRG', 'S64CFG.PRG',
                      'SYSTEM/S64FILE.BIN', 'SYSTEM/S64MODEL.BIN',
                      'SYSTEM/S64PREP.BIN', 'SYSTEM/S64RUN.BIN',
                      'SYSTEM/S64MODULE.MNF', 'SYSTEM/S64OVL.MNF'}
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert actual == expected, (sorted(actual - expected), sorted(expected - actual))
          assert {p.name for p in root.rglob('*') if p.is_dir()} == {'SYSTEM'}
          assert not any(p.is_symlink() for p in root.rglob('*'))
          print('USB1 package: 4 root PRGs and 6 SYSTEM assets')
          PY

# Hardware directory readback, physical input, cold power, recovery and VICE
# still require separate acceptance. This job never deploys binaries.
