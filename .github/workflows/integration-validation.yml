name: Integration validation

on:
  push:
    branches:
      - integration-validation-2026-09-24
      - feature/link-formatting-ui
  workflow_dispatch:

concurrency:
  group: see64you-integration-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, terra64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build current C64 test PRG
        run: make -C client clean all

      - name: Report current C64 memory map
        run: cat client/build/see64you.map

      - name: Publish current C64 test PRG
        uses: actions/upload-artifact@v4
        with:
          name: see64you-prg
          path: client/build/see64you.prg
          if-no-files-found: error
          retention-days: 30

      - name: Publish current C64 memory map
        uses: actions/upload-artifact@v4
        with:
          name: see64you-map
          path: client/build/see64you.map
          if-no-files-found: error
          retention-days: 30

      - name: Run full validation
        run: sh ./tools/validate.sh
