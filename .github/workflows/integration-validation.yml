name: Integration validation

on:
  push:
    branches:
      - integration-validation-2026-09-24
      - feature/c64u-publisher-chain
  workflow_dispatch:

concurrency:
  group: see64you-integration-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, terra64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build current C64 test PRG
        run: make -C client clean all

      - name: Build C64U REU editor PRG
        run: |
          make -C client c64u
          python3 tools/check_memory_headroom.py client/build/see64you-c64u.map \
            --label "C64U editor" --min-headroom 1024

      - name: Build REU diagnostic PRG
        run: make -C client reu-probe

      - name: Report current C64 memory map
        run: cat client/build/see64you.map

      - name: Report C64U REU memory map
        run: cat client/build/see64you-c64u.map

      - name: Publish current C64 test PRG
        uses: actions/upload-artifact@v4
        with:
          name: see64you-prg
          path: client/build/see64you.prg
          if-no-files-found: error
          retention-days: 30

      - name: Publish current C64 memory map
        uses: actions/upload-artifact@v4
        with:
          name: see64you-map
          path: client/build/see64you.map
          if-no-files-found: error
          retention-days: 30

      - name: Publish C64U REU editor PRG
        uses: actions/upload-artifact@v4
        with:
          name: see64you-c64u-prg
          path: client/build/see64you-c64u.prg
          if-no-files-found: error
          retention-days: 30

      - name: Publish C64U REU memory map
        uses: actions/upload-artifact@v4
        with:
          name: see64you-c64u-map
          path: client/build/see64you-c64u.map
          if-no-files-found: error
          retention-days: 30

      - name: Publish REU diagnostic PRG
        uses: actions/upload-artifact@v4
        with:
          name: see64you-reu-probe
          path: client/build/reu-probe.prg
          if-no-files-found: error
          retention-days: 30

      - name: Measure publisher companion fit
        run: |
          make -C client publisher-companion-fit
          python3 tools/check_memory_headroom.py client/build/publisher-companion-fit.map \
            --label "C64U publisher companion" --min-headroom 1024

      - name: Build C64U publisher PRG
        run: |
          make -C client publisher
          python3 tools/check_memory_headroom.py client/build/see64you-publisher.map \
            --label "C64U publisher" --min-headroom 1024

      - name: Publish C64U publisher PRG
        uses: actions/upload-artifact@v4
        with:
          name: see64you-publisher-prg
          path: client/build/see64you-publisher.prg
          if-no-files-found: error
          retention-days: 30

      - name: Publish C64U publisher memory map
        uses: actions/upload-artifact@v4
        with:
          name: see64you-publisher-map
          path: client/build/see64you-publisher.map
          if-no-files-found: error
          retention-days: 30

      - name: Publish chained C64U application pair
        uses: actions/upload-artifact@v4
        with:
          name: see64you-c64u-package
          path: |
            client/build/SEE64YOU-C64U.PRG
            client/build/S64PUB.PRG
          if-no-files-found: error
          retention-days: 30

      - name: Run full validation
        run: sh ./tools/validate.sh
